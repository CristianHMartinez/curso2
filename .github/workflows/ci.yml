# CI del Curso 2. Verde = requisito mínimo de la entrega, no la calificación.
# Los checks crecen con el curso:
#   Sesión 1+  → assets: npm ci && npm run build
#   Sesión 2+  → descomentar "backend": composer install + migraciones (SQLite)
#   Sesión 6+  → descomentar los tests dentro de "backend"
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  assets:
    name: Build de assets (Vite + Tailwind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

